conky.config = {
    output_backend = 'x11',
    update_interval = 2,
    total_run_times = 0,

    font = 'JetBrainsMono Nerd Font Mono:size=13',
    use_xft = true,

    default_color = 'e8d5c4',
    color1 = 'd4af37',
    color2 = 'b22222',
    color3 = 'f0c040',
    color4 = '7fc8ff',
    color5 = '888888',

    own_window = true,
    own_window_type = 'desktop',
    own_window_color = '#00000000',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    double_buffer = true,
    no_buffers = true,
    text_buffer_size = 2048,

    minimum_width = 380,
    minimum_height = 800,
    alignment = 'top_right',
    gap_x = 40,
    gap_y = 60,

    draw_shades = true,
    default_shade_color = '000000',

    draw_outline = false,
    draw_borders = false,
    border_width = 0,

    text_alpha = 0.9,

    cpu_avg_samples = 4,
    net_avg_samples = 2,
    temperature_unit = 'celsius',
    short_units = true,
}

conky.text = [[
${color1}${time %H:%M}
${color5}${time %A, %B %d %Y}
${color2}${hr 2}
${color1}SYSTEM
${color}  Hostname ${alignr}${color3}${nodename}
${color}  Kernel ${alignr}${color3}${kernel}
${color}  Uptime ${alignr}${color3}${uptime_short}
${color}  Processes ${alignr}${color3}${processes} (${running_processes} run)

${color1}CPU
${color}  Usage: ${cpu cpu0}% ${alignr}${color3}${freq_g} GHz
${color2}${cpubar cpu0 8,}
${color}  Core 1: ${cpu cpu1}%${alignr}Core 2: ${cpu cpu2}%
${color}  Core 3: ${cpu cpu3}%${alignr}Core 4: ${cpu cpu4}%

${color1}MEMORY
${color}  RAM ${alignr}${color3}${mem} / ${memmax}
${color2}${membar 8,}
${color}  Swap ${alignr}${color3}${swap} / ${swapmax}

${color1}DISK
${color}  / ${alignr}${color3}${fs_used /} / ${fs_size /}
${color2}${fs_bar 8 /}
${color}  Read: ${color4}${diskio_read}${alignr}${color}Write: ${color4}${diskio_write}

${color1}NETWORK
${color}  Down ${color4}${downspeed enp6s0}${alignr}${color}Up ${color4}${upspeed enp6s0}
${color}  Total ${alignr}${color3}${totaldown enp6s0} / ${totalup enp6s0}

${color1}TOP PROCESSES
${color3} ${top name 1}${alignr}${top cpu 1}%
${color} ${top name 2}${alignr}${top cpu 2}%
${color} ${top name 3}${alignr}${top cpu 3}%
${color5} ${top name 4}${alignr}${top cpu 4}%
${color5} ${top name 5}${alignr}${top cpu 5}%
${color2}${hr 2}
]]
